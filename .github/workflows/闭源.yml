name: 🚀 编译 WR30U 闭源固件 (237)

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    name: 🚀 编译 WR30U 闭源固件
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools \
            unzip wget xsltproc zlib1g-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libpython3-dev libreadline-dev libtool libyaml-dev libz-dev lld llvm mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3-ply \
            python3-docutils qemu-utils re2c scons squashfs-tools texinfo uglifyjs \
            upx-ucl vim xmlto xxd zstd autoconf automake autopoint bison

      - name: 克隆 237 闭源源码
        working-directory: /tmp
        run: |
          sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir
          cd /workdir
          git clone -b mt798x-mt799x-6.6-mtwifi --single-branch --filter=blob:none \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt
          ls /workdir/openwrt/rules.mk

      - name: 克隆第三方包
        working-directory: /workdir/openwrt
        run: |
          git clone --depth 1 https://github.com/SunBK201/UA3F.git package/UA3F
          git clone --depth 1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter
          git clone --depth 1 https://github.com/CHN-beta/rkp-ipid.git package/rkp-ipid

          # quickstart 全家桶
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/small-package.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8

          # argon 主题
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: 依赖预处理
        working-directory: /workdir/openwrt
        run: |
          # quickstart 清理多余依赖
          for file in $(find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null); do
            cp "$file" "$file.bak"
            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"
          done

          # OAF 补 sqlite3 依赖
          sed -i 's#^DEPENDS:=.*#DEPENDS:=+libsqlite3 +libcurl +libpthread +libjson-c +libubox +libubus#' \
            package/OpenAppFilter/open-app-filter/Makefile 2>/dev/null || true

          # UA3F 加 Go 代理
          sed -i '1i export GOPROXY=https://goproxy.cn,direct' package/UA3F/openwrt/Makefile

          # 从官方源码复制 sqlite3
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/immortalwrt/packages.git pkgs-src
          cd pkgs-src && git sparse-checkout set libs/sqlite3 && cd /tmp
          cp -r pkgs-src/libs/sqlite3 /workdir/openwrt/package/libs/
          rm -rf pkgs-src

      - name: 6.6 内核源码修复
        working-directory: /workdir/openwrt
        run: |
          SRC="package/mtk/drivers/mt_wifi/src"

          # 1. netif_rx_ni -> netif_rx
          grep -rl "netif_rx_ni" "$SRC" 2>/dev/null | xargs -r sed -i 's/netif_rx_ni/netif_rx/g'

          # 2. rt_config.h 删掉 wapp 递归 include，补宏定义
          RT_CONFIG="$SRC/mt_wifi/embedded/include/rt_config.h"
          sed -i '/#include "wapp\/wapp_cmm_type.h"/d' "$RT_CONFIG"
          sed -i '/#include "wapp\/wapp.h"/d' "$RT_CONFIG"
          sed -i '1i #ifndef PRECALPART_OFFSET\n#define PRECALPART_OFFSET 0x10000\n#endif\n#ifndef PRE_CAL_SIZE\n#define PRE_CAL_SIZE 0x10000\n#endif\n#ifndef PRE_CAL_SIZE_ONE_CARD\n#define PRE_CAL_SIZE_ONE_CARD 0x10000\n#endif\n#ifndef DCOC_IMAGE_SIZE\n#define DCOC_IMAGE_SIZE 0x8000\n#endif\n#ifndef TXDPD_IMAGE1_SIZE\n#define TXDPD_IMAGE1_SIZE 0x8000\n#endif\n#ifndef TXDPD_IMAGE2_SIZE\n#define TXDPD_IMAGE2_SIZE 0x8000\n#endif\n#ifndef DPDPART1_OFFSET\n#define DPDPART1_OFFSET 0x20000\n#endif\n#ifndef DPDPART2_OFFSET\n#define DPDPART2_OFFSET 0x28000\n#endif' "$RT_CONFIG"

          # 3. qos.c 单独 include wapp
          QOS_C="$SRC/mt_wifi/embedded/common/qos.c"
          grep -q 'wapp/wapp_cmm_type.h' "$QOS_C" || \
            sed -i '/#include "rt_config.h"/a #include "wapp/wapp_cmm_type.h"\n#include "wapp/wapp.h"' "$QOS_C"

          # 4. mt_cmd.c 补 pAd 声明 + 修多余括号
          MT_CMD="$SRC/mt_wifi/mcu/mt_cmd.c"
          sed -i '/static VOID MtCmdGetRXDCOCCalResultRsp(struct cmd_msg \*msg, char \*Data, UINT16 Len)/{n;a\	RTMP_ADAPTER *pAd = NULL;
          }' "$MT_CMD"
          sed -i '/static VOID MtCmdGetTXDPDCalResultRsp(struct cmd_msg \*msg, char \*Data, UINT16 Len)/{n;a\	RTMP_ADAPTER *pAd = NULL;
          }' "$MT_CMD"
          sed -i 's/"\(ret = %d\)\\n", ret));/"\1\\n", ret);/' "$MT_CMD"
          sed -i 's/chGroup));/chGroup);/' "$MT_CMD"

          # 5. eeprom.c 加 pragma
          EEPROM_C="$SRC/mt_wifi/embedded/common/eeprom.c"
          grep -q 'pragma GCC diagnostic ignored "-Waddress"' "$EEPROM_C" || \
            sed -i '1i #pragma GCC diagnostic ignored "-Waddress"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#pragma GCC diagnostic ignored "-Wunused-variable"\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"' "$EEPROM_C"

          # 6. ap.c 补 MT_MAC 和 MURA
          AP_C="$SRC/mt_wifi/embedded/ap/ap.c"
          grep -q 'MT_MAC 1' "$AP_C" || \
            sed -i '/#include "rt_config.h"/i #ifndef MT_MAC\n#define MT_MAC 1\n#endif\n#ifndef CFG_SUPPORT_MU_MIMO_RA\n#define CFG_SUPPORT_MU_MIMO_RA 1\n#endif' "$AP_C"

          # 7. 全局 -Werror -> -Wno-error
          find "$SRC" -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} \;
          find "$SRC" -name "config.mk" -exec sed -i 's/-Werror/-Wno-error/g' {} \;

          # 8. 删除 mt_wifi 对 warp 的依赖（禁用 warp）
          sed -i 's/PKG_BUILD_DEPENDS:=warp/PKG_BUILD_DEPENDS:=/' package/mtk/drivers/mt_wifi/Makefile
          sed -i 's/  DEPENDS+=+kmod-warp//' package/mtk/drivers/mt_wifi/Makefile
          sed -i 's/mt_wifi mtk_warp_proxy/mt_wifi/' package/mtk/drivers/mt_wifi/Makefile

      - name: 修复版本号占位符
        working-directory: /workdir/openwrt
        run: |
          cat > package/base-files/files/etc/openwrt_release << 'EOF'
          DISTRIB_ID='ImmortalWrt'
          DISTRIB_RELEASE='%VERSION_NUMBER%'
          DISTRIB_REVISION='%VERSION_CODE%'
          DISTRIB_TARGET='%BOARD%/%SUBTARGET%'
          DISTRIB_ARCH='%ARCH%'
          DISTRIB_DESCRIPTION='ImmortalWrt %VERSION_NUMBER% %VERSION_CODE%'
          EOF

      - name: 修改默认版本号
        working-directory: /workdir/openwrt
        run: |
          sed -i 's/24.10-SNAPSHOT/24.10.6/' include/version.mk
          sed -i 's/\$(REVISION)/r33869-cf234f8de6d5/' include/version.mk
          grep -E "VERSION_NUMBER|VERSION_CODE" include/version.mk

      - name: 复制自定义配置文件
        run: |
          cp -f $GITHUB_WORKSPACE/wr30u.config /workdir/openwrt/.config
          cp -f $GITHUB_WORKSPACE/diy.sh /workdir/openwrt/
          cp -f $GITHUB_WORKSPACE/seed.config /workdir/openwrt/
          cp -f $GITHUB_WORKSPACE/feeds.conf.default /workdir/openwrt/ 2>/dev/null || true

      - name: 运行 diy.sh
        working-directory: /workdir/openwrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新 feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 追加第三方包和版本号
        working-directory: /workdir/openwrt
        run: |
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_ua3f=y
          CONFIG_PACKAGE_kmod-oaf=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-lib-taskd=y
          CONFIG_PACKAGE_luci-lib-xterm=y
          CONFIG_PACKAGE_taskd=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_VERSION_NUMBER="24.10.6"
          CONFIG_VERSION_CODE="r33869-cf234f8de6d5"
          EOF

          # 禁用不想要的包
          for pkg in shadow shadow-utils smartd smartmontools mdadm kmod-warp \
                     luci-app-radicale3; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done

          # 启用简体中文
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          yes "" | make oldconfig

      - name: 校验关键配置
        working-directory: /workdir/openwrt
        run: |
          echo "==== 版本号 ===="
          grep -E "CONFIG_VERSION_(NUMBER|CODE)" .config
          echo "==== 设备 ===="
          grep "wr30u-ubootmod=y" .config
          echo "==== 关键包 ===="
          grep -E "CONFIG_PACKAGE_(ua3f|kmod-oaf|luci-app-oaf|kmod-rkp-ipid|quickstart|luci-app-quickstart|luci-theme-argon)=y" .config

      - name: 上传配置备份
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            /workdir/openwrt/.config
            /workdir/openwrt/feeds.conf.default

      - name: 开始编译
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: 编译后版本校验
        working-directory: /workdir/openwrt
        run: |
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release
          echo "==== 固件列表 ===="
          ls -lh bin/targets/mediatek/filogic/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: WR30U-ubootmod-firmware
          path: /workdir/openwrt/bin/targets/mediatek/filogic/*.bin
