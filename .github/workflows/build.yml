name: 🚀 编译 (Build) - ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择目标设备 (Target Device)'
        type: choice
        options:
          - AX3000T
          - WR30U
        default: AX3000T
      layout:
        description: '选择分区布局 (Partition Layout)'
        type: choice
        options:
          - stock
          - ubootmod
        default: stock
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

env:
  DEVICE: ${{ github.event.inputs.device || 'AX3000T' }}
  LAYOUT: ${{ github.event.inputs.layout || 'stock' }}

permissions: write-all

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    outputs:
      fw_version: ${{ steps.extract-version.outputs.fw_version }}
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ========== UA3F ==========
      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      # ========== OpenAppFilter (OAF) ==========
      - name: 克隆 OpenAppFilter (OAF) 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      # ========== TurboACC（来自 chenmozhijin/turboacc）==========
      - name: 添加 TurboACC 源码
        working-directory: ImmortalWrt
        run: |
          curl -sSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh --no-sfe
          echo "✅ TurboACC 已添加（来自 chenmozhijin，兼容 24.10）"

        
      # ========== 湛江科技学院校园网认证 ==========
      - name: 克隆并准备 ZJKJU 源码（提取预编译二进制）
        working-directory: ImmortalWrt
        run: |
          # 1. 克隆源码
          git clone https://github.com/woniuchidaodan/zjkju-auth.git package/luci-app-zjkju-auth
          cd package/luci-app-zjkju-auth

          # 2. 下载作者预编译的 ipk 包
          wget -O zjkju.ipk https://github.com/woniuchidaodan/zjkju-auth/releases/download/v1.0.0-r1-43/luci-app-zjkju-auth_1.0.0-r1_all.ipk

          echo "==== 文件格式诊断 ===="
          file zjkju.ipk
          echo "--- 前 16 字节 ---"
          xxd zjkju.ipk | head -1

          # 3. 智能解压：根据文件头判断格式
          mkdir -p /tmp/zjkju-extract
          if head -c 8 zjkju.ipk | grep -q '!<arch>'; then
              echo "→ 检测到 ar 格式 (OpenWrt 传统 ipk)"
              cd /tmp/zjkju-extract
              ar x "$OLDPWD/zjkju.ipk"
              tar -xzf data.tar.gz
              cd "$OLDPWD"
          else
              echo "→ 非 ar 格式，尝试 tar 解压"
              if ! tar -xf zjkju.ipk -C /tmp/zjkju-extract 2>/dev/null; then
                  echo "→ tar 失败，尝试 gzip + tar"
                  gzip -dc zjkju.ipk | tar -xf - -C /tmp/zjkju-extract
              fi
          fi

          # 4. 查找并复制 ruijie 二进制文件
          echo "==== 查找 ruijie ===="
          find /tmp/zjkju-extract -name "ruijie" -type f

          mkdir -p root/usr/bin
          RUIJIE_PATH=$(find /tmp/zjkju-extract -name "ruijie" -type f | head -1)
          if [ -z "$RUIJIE_PATH" ]; then
              echo "❌ 未在 ipk 中找到 ruijie 文件"
              exit 1
          fi
          cp "$RUIJIE_PATH" root/usr/bin/ruijie
          chmod +x root/usr/bin/ruijie
          echo "✅ ruijie 已复制到 root/usr/bin/"
          file root/usr/bin/ruijie

          # 5. 清理
          rm -rf zjkju.ipk /tmp/zjkju-extract
          echo "✅ ZJKJU 源码及预编译 ruijie 二进制文件已准备就绪"

      # ========== quickstart 全家桶（从 kenzok8 源） ==========
      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      # ========== 修改 quickstart Makefile，移除不需要的依赖（安全修复版） ==========
      - name: 修改 quickstart Makefile 移除不必要依赖
        working-directory: ImmortalWrt
        run: |
          echo "==== 查找 quickstart 相关 Makefile ===="
          find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null

          echo ""
          echo "==== 开始清理（只删包名，保留行结构和续行符）===="
          for file in $(find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null); do
            echo "🔧 处理: $file"
            cp "$file" "$file.bak"

            # 只删除特定包名，不破坏行尾的续行符 \，不压缩全局空格
            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"

            echo "  ✅ 已处理"
            grep -E "DEPENDS" "$file" || echo "(无 DEPENDS)"
          done
          echo ""
          echo "✅ quickstart 依赖清理完成"

      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t-stock.config ax3000t-ubootmod.config wr30u-stock.config wr30u-ubootmod.config ImmortalWrt/ 2>/dev/null || true

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 清理 default-settings 中的不必要依赖 ==========
      - name: 清理 default-settings 中的不必要依赖
        working-directory: ImmortalWrt
        run: |
          echo "==== 查找 default-settings 相关文件 ===="
          find package/ -path "*default-settings*" -name "Makefile" 2>/dev/null
          find package/ -path "*default-settings*" -name "*.mk" 2>/dev/null

          echo ""
          echo "==== 开始清理 ===="
          for file in $(find package/ -path "*default-settings*" \( -name "Makefile" -o -name "*.mk" \) 2>/dev/null); do
            echo "🔧 处理: $file"

            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"

            echo "  ✅ 已处理"
          done
          echo ""
          echo "✅ default-settings 依赖清理完成"

      # ========== 根据选择的设备和布局加载对应配置 ==========
      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config

          if [ "${{ env.DEVICE }}" = "WR30U" ]; then
            DEVICE_BASE="wr30u"
          else
            DEVICE_BASE="ax3000t"
          fi

          if [ "${{ env.LAYOUT }}" = "ubootmod" ]; then
            CONFIG_FILE="${DEVICE_BASE}-ubootmod.config"
            DEVICE_ID="xiaomi_mi-router-${DEVICE_BASE}-ubootmod"
            LAYOUT_NAME="ubootmod"
          else
            CONFIG_FILE="${DEVICE_BASE}-stock.config"
            DEVICE_ID="xiaomi_mi-router-${DEVICE_BASE}"
            LAYOUT_NAME="stock"
          fi

          echo "📦 使用配置文件: $CONFIG_FILE"
          echo "📦 目标设备: $DEVICE_ID"
          echo "📦 分区布局: $LAYOUT_NAME"

          if [ ! -f "../$CONFIG_FILE" ]; then
            echo "❌ 错误：配置文件 ../$CONFIG_FILE 不存在！"
            exit 1
          fi
          cp "../$CONFIG_FILE" .config

          if [ -f "../seed.config" ]; then
            grep '^CONFIG_PACKAGE_' ../seed.config >> .config 2>/dev/null || true
          fi

          # ========== 统一批量禁用 shadow、smartd、smartmontools、mdadm ==========
          echo "==== 开始批量禁用不需要的包 ===="
          
          # 注意：libsmartcols1 是 util-linux 的基础库，绝对不能禁用，否则会破坏系统！
          for pkg in shadow shadow-common shadow-utils shadow-chage shadow-chfn shadow-chgpasswd \
                     shadow-chpasswd shadow-chsh shadow-expiry shadow-faillog shadow-gpasswd \
                     shadow-groupadd shadow-groupdel shadow-groupmems shadow-groupmod shadow-groups \
                     shadow-grpck shadow-grpconv shadow-grpunconv shadow-lastlog shadow-login \
                     shadow-logoutd shadow-newgidmap shadow-newgrp shadow-newuidmap shadow-newusers \
                     shadow-nologin shadow-passwd shadow-pwck shadow-pwconv shadow-pwunconv \
                     shadow-su shadow-useradd shadow-userdel shadow-usermod shadow-vipw \
                     smartd smartmontools smartmontools-drivedb mdadm; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done

          # 禁用 shadow 密码支持
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          # ----- 启用简体中文语言 -----
          sed -i '/CONFIG_LUCI_LANG_zh_Hans/d' .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          # ----- 让所有禁用和启用生效（只在这时执行一次 oldconfig） -----
          yes "" | make oldconfig

          # ----- 验证 -----
          echo "==== 验证禁用是否生效 ===="
          if grep -q "^CONFIG_PACKAGE_shadow.*=y" .config || grep -q "^CONFIG_PACKAGE_smartd.*=y" .config || grep -q "^CONFIG_PACKAGE_mdadm.*=y" .config; then
            echo "❌ 警告：仍有 shadow、smartd 或 mdadm 被选中！"
            grep -E "^CONFIG_PACKAGE_(shadow|smartd|smartmontools|mdadm).*=y" .config || true
          else
            echo "✅ 所有 shadow、smartd、smartmontools、mdadm 已成功禁用"
          fi

          # ----- 设备校验 -----
          if ! grep -q "$DEVICE_ID" .config; then
            echo "❌ 错误：设备类型 $DEVICE_ID 未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：${DEVICE_BASE^^}-${LAYOUT_NAME}"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 编译后版本校验并提取版本信息
        id: extract-version
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          FW_TAG=$(git describe --tags)
          echo "FW_TAG=$FW_TAG"
          FW_VERSION=${FW_TAG#v}
          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
          echo "fw_version=$FW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ 提取版本号: $FW_VERSION"

          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_${{ env.FW_VERSION }}_${{ env.DEVICE }}_${{ env.LAYOUT }}
          path: ImmortalWrt/bin/targets

  # ============================================================
  # 📦 调用独立发布工作流
  # ============================================================
  release:
    name: 📦 发布固件
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/release.yml
    with:
      device: ${{ github.event.inputs.device || 'AX3000T' }}
      layout: ${{ github.event.inputs.layout || 'stock' }}
      fw_version: ${{ needs.build.outputs.fw_version }}
      run_number: ${{ github.run_number }}

  # ============================================================
  # SSH 调试作业（与 build 逻辑一致，仅多出 ssh 步骤）
  # ============================================================
  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 克隆 OpenAppFilter (OAF) 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: 添加 TurboACC 源码
        working-directory: ImmortalWrt
        run: |
          curl -sSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh --no-sfe
          echo "✅ TurboACC 已添加（来自 chenmozhijin，兼容 24.10）"

      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      # ========== 修改 quickstart Makefile，移除不需要的依赖（安全修复版） ==========
      - name: 修改 quickstart Makefile 移除不必要依赖
        working-directory: ImmortalWrt
        run: |
          echo "==== 查找 quickstart 相关 Makefile ===="
          find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null

          echo ""
          echo "==== 开始清理（只删包名，保留行结构和续行符）===="
          for file in $(find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null); do
            echo "🔧 处理: $file"
            cp "$file" "$file.bak"

            # 只删除特定包名，不破坏行尾的续行符 \，不压缩全局空格
            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"

            echo "  ✅ 已处理"
            grep -E "DEPENDS" "$file" || echo "(无 DEPENDS)"
          done
          echo ""
          echo "✅ quickstart 依赖清理完成"

      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t-stock.config ax3000t-ubootmod.config wr30u-stock.config wr30u-ubootmod.config ImmortalWrt/ 2>/dev/null || true

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 清理 default-settings 中的不必要依赖 ==========
      - name: 清理 default-settings 中的不必要依赖
        working-directory: ImmortalWrt
        run: |
          echo "==== 查找 default-settings 相关文件 ===="
          find package/ -path "*default-settings*" -name "Makefile" 2>/dev/null
          find package/ -path "*default-settings*" -name "*.mk" 2>/dev/null

          echo ""
          echo "==== 开始清理 ===="
          for file in $(find package/ -path "*default-settings*" \( -name "Makefile" -o -name "*.mk" \) 2>/dev/null); do
            echo "🔧 处理: $file"

            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"

            echo "  ✅ 已处理"
          done
          echo ""
          echo "✅ default-settings 依赖清理完成"

      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config

          if [ "${{ env.DEVICE }}" = "WR30U" ]; then
            DEVICE_BASE="wr30u"
          else
            DEVICE_BASE="ax3000t"
          fi

          if [ "${{ env.LAYOUT }}" = "ubootmod" ]; then
            CONFIG_FILE="${DEVICE_BASE}-ubootmod.config"
            DEVICE_ID="xiaomi_mi-router-${DEVICE_BASE}-ubootmod"
            LAYOUT_NAME="ubootmod"
          else
            CONFIG_FILE="${DEVICE_BASE}-stock.config"
            DEVICE_ID="xiaomi_mi-router-${DEVICE_BASE}"
            LAYOUT_NAME="stock"
          fi

          echo "📦 使用配置文件: $CONFIG_FILE"
          echo "📦 目标设备: $DEVICE_ID"
          echo "📦 分区布局: $LAYOUT_NAME"

          if [ ! -f "../$CONFIG_FILE" ]; then
            echo "❌ 错误：配置文件 ../$CONFIG_FILE 不存在！"
            exit 1
          fi
          cp "../$CONFIG_FILE" .config

          if [ -f "../seed.config" ]; then
            grep '^CONFIG_PACKAGE_' ../seed.config >> .config 2>/dev/null || true
          fi

          # ========== 统一批量禁用 shadow、smartd、smartmontools、mdadm ==========
          echo "==== 开始批量禁用不需要的包 ===="
          
          for pkg in shadow shadow-common shadow-utils shadow-chage shadow-chfn shadow-chgpasswd \
                     shadow-chpasswd shadow-chsh shadow-expiry shadow-faillog shadow-gpasswd \
                     shadow-groupadd shadow-groupdel shadow-groupmems shadow-groupmod shadow-groups \
                     shadow-grpck shadow-grpconv shadow-grpunconv shadow-lastlog shadow-login \
                     shadow-logoutd shadow-newgidmap shadow-newgrp shadow-newuidmap shadow-newusers \
                     shadow-nologin shadow-passwd shadow-pwck shadow-pwconv shadow-pwunconv \
                     shadow-su shadow-useradd shadow-userdel shadow-usermod shadow-vipw \
                     smartd smartmontools smartmontools-drivedb mdadm; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          sed -i '/CONFIG_LUCI_LANG_zh_Hans/d' .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          # 让所有禁用和启用生效（只在这时执行一次 oldconfig）
          yes "" | make oldconfig

          # 验证
          if grep -q "^CONFIG_PACKAGE_shadow.*=y" .config || grep -q "^CONFIG_PACKAGE_smartd.*=y" .config || grep -q "^CONFIG_PACKAGE_mdadm.*=y" .config; then
            echo "❌ 警告：仍有 shadow、smartd 或 mdadm 被选中！"
            grep -E "^CONFIG_PACKAGE_(shadow|smartd|smartmontools|mdadm).*=y" .config || true
          else
            echo "✅ 所有 shadow、smartd、smartmontools、mdadm 已成功禁用"
          fi

          if ! grep -q "$DEVICE_ID" .config; then
            echo "❌ 错误：设备类型 $DEVICE_ID 未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：${DEVICE_BASE^^}-${LAYOUT_NAME}"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 开启 SSH 服务
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 编译后版本校验并提取版本信息
        id: extract-version-ssh
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          FW_TAG=$(git describe --tags)
          echo "FW_TAG=$FW_TAG"
          FW_VERSION=${FW_TAG#v}
          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
          echo "fw_version=$FW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ 提取版本号: $FW_VERSION"

          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_${{ env.FW_VERSION }}_${{ env.DEVICE }}_${{ env.LAYOUT }}
          path: ImmortalWrt/bin/targets
